      const protectEntireTrip=activeView==="upcoming"||activeView==="past";
      const blogContent=protectContent(tripContent,!protectEntireTrip&&Boolean(t.blog||t.blogDays?.length)?"旅程網誌需要家人通行碼":"");
      const tripPage='<a class="back-link" href="/family-travel-hub/">← 回到首頁</a><section class="detail-hero"><div class="detail-meta"><span class="date-chip">'+escapeHtml(dateText(t.start,t.end))+'</span><span class="status '+statusClass+'">'+escapeHtml(t.label)+'</span></div><h1>'+escapeHtml(t.title)+'</h1><p><b>'+escapeHtml(t.area)+'</b></p><p>'+escapeHtml(t.summary)+'</p></section>'+photos+'<div class="calendar-box"><div><b>這趟的分享網址</b><br><code>'+escapeHtml(tripUrl(t.id))+'</code></div><button class="button" type="button" data-copy="'+escapeHtml(t.id)+'">複製網址</button><span class="toast" data-toast="'+escapeHtml(t.id)+'" aria-live="polite"></span></div>'+extra+conversation(t)+(t.id===TravelPrep.tripId?TravelPrep.board():"")+blogContent;
      app.innerHTML=protectEntireTrip?protectContent(tripPage,activeView==="upcoming"?"這趟未來行程需要家人通行碼":"走過的日子需要家人通行碼")+footer():tripPage+footer();
      restoreChecks();
      document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.view===activeView));
      document.title=t.title+"｜家庭旅行手帳";
    }
    document.addEventListener("error",e=>{const image=e.target;if(!(image instanceof HTMLImageElement)||!image.dataset.photoFile||image.dataset.photoFallbackUsed)return;image.dataset.photoFallbackUsed="1";image.src=image.dataset.photoFile},true);
    document.addEventListener("submit",e=>{
      const form=e.target.closest("[data-access-unlock]");if(!form)return;
      e.preventDefault();
      const entered=form.elements["access-code"].value.trim();
      if(!ACCESS_CODES.has(entered)){form.querySelector("[data-blog-status],#access-lock-status").textContent="通行碼不正確，請再確認後輸入。";return}
      try{sessionStorage.setItem(ACCESS_UNLOCK_KEY,"1")}catch{}
      const locked=document.querySelector(".access-lock");
      if(locked)locked.outerHTML=pendingProtectedContent;
      pendingProtectedContent="";
      restoreChecks();
    });
    document.addEventListener("click",async e=>{const b=e.target.closest("[data-copy], [data-copy-url]");if(!b)return;const id=b.dataset.copy;const toast=id?document.querySelector('[data-toast="'+id+'"]'):null;const value=b.dataset.copyUrl||tripUrl(id);try{await navigator.clipboard.writeText(value);if(toast)toast.textContent="已複製，可以貼到家族對話或行事曆。";else b.textContent="已複製本日網址"}catch{if(toast)toast.textContent="複製未成功，請開啟這趟行程，長按顯示的網址複製。";else b.textContent="複製失敗，請長按網址複製"}});
    const trip=trips.find(t=>t.id===params.get("t"));
    if(trip)renderTrip(trip);else renderHome(viewFromUrl());
    document.addEventListener("travel-prep:updated",()=>{if(trip)renderTrip(trip);else renderHome(viewFromUrl())});
    window.addEventListener("hashchange",()=>{if(!params.has("t"))renderHome(viewFromUrl())});
  </script>
  <script src="site-updates.js?v=20261011-mom-voice-1"></script>
</body>
