    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const tripUrl = id => location.origin + location.pathname + "?t=" + encodeURIComponent(id);
    function footer(){return '<footer class="footnote">固定一個家庭總站，每趟旅程有自己的行事曆短網址。公開連結不用邀請即可開啟；頁面不放完整姓名、住址或聯絡資料。<br>勾選與備註尚未連接同步功能，請以這個頁面顯示的行程資訊為準。</footer>'}
    function card(t,view){
      const statusClass=t.state==="done"?"done":t.state==="waiting"?"waiting":"planned";
      const excerpt=t.summary.length>104?t.summary.slice(0,104)+"…":t.summary;
      const expanded=view==="today"||view==="upcoming";
      const stops=expanded?(t.stops||[]).map(row=>{
        const time=Array.isArray(row)?row[0]:row.time;
        const title=Array.isArray(row)?row[1]:row.title;
        const desc=Array.isArray(row)?row[2]:row.desc;
        const hours=Array.isArray(row)||!row.hours?"":'<div class="stop-facts"><p>◷ '+escapeHtml(row.hours)+'</p></div>';
        const restroom=Array.isArray(row)||!row.restroom?"":'<p class="location-note"><b>如廁安排：</b>'+escapeHtml(row.restroom)+'</p>';
        const photos=Array.isArray(row)||!row.photos?"":'<div class="stop-photos">'+row.photos.map(p=>'<img src="'+escapeHtml(p[0])+'" alt="'+escapeHtml(p[1])+'" loading="lazy"></div>').join("");
        const links=Array.isArray(row)||!row.links?"":'<div class="stop-links">'+row.links.map(l=>'<a class="button alt" href="'+escapeHtml(l.href)+'" target="_blank" rel="noopener">'+escapeHtml(l.label)+' ↗</a>').join("")+'</div>';
        return '<article class="timeline-stop"><div class="time">'+escapeHtml(time)+'</div><div><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(desc)+'</p>'+hours+restroom+photos+links+'</div></article>';
      }).join(""):"";
      const details=expanded?(t.details||[]).map(d=>'<section class="panel guide-card"><h3>'+escapeHtml(d.title)+'</h3><p>'+escapeHtml(d.intro)+'</p><ul>'+d.bullets.map(x=>'<li>'+escapeHtml(x)+'</li>').join("")+'</ul></section>').join(""):"";
      const checklist=expanded&&t.checklist?'<section class="panel checklist-card"><h3>出門前，勾一下</h3><ul class="checklist">'+t.checklist.map(x=>'<li>'+escapeHtml(x)+'</li>').join("")+'</ul></section>':"";
      const sources=expanded&&t.sources?'<section class="panel"><h3>店家與官方資訊</h3><ul class="source-list">'+t.sources.map(s=>'<li><a href="'+escapeHtml(s[1])+'" target="_blank" rel="noopener">'+escapeHtml(s[0])+' ↗</a></li>').join("")+'</ul><p class="small">資訊查核：'+escapeHtml(t.checkedOn||"")+'</p></section>':"";
      const action=expanded?"":'<div class="card-actions"><a class="button" href="?t='+encodeURIComponent(t.id)+'">打開這趟行程 ↗</a><button class="button alt" type="button" data-copy="'+escapeHtml(t.id)+'">複製行事曆網址</button></div><span class="toast" data-toast="'+escapeHtml(t.id)+'" aria-live="polite"></span>';
      const itinerary=expanded?'<section class="today-expanded" aria-label="今日完整行程"><h3>今日安排</h3><div class="timeline">'+stops+'</div>'+details+checklist+sources+'</section>':"";
      return '<article class="trip-card '+(expanded?"trip-card-expanded":"")+'"><div class="card-top"><span class="date-chip">'+escapeHtml(dateText(t.start,t.end))+'</span><span class="status '+statusClass+'">'+escapeHtml(t.label)+'</span></div><h3>'+escapeHtml(t.title)+'</h3><p class="small">'+escapeHtml(t.area)+'</p><p>'+escapeHtml(expanded?"":excerpt)+'</p>'+action+itinerary+'</article>';
    }
    function renderHome(view){
      app.className="home-view-"+view;
      const filtered=trips.filter(t=>view==="all" || (view==="today" && t.start<=dayNow && t.end>=dayNow) || (view==="upcoming" && t.start>dayNow) || (view==="past" && t.end<dayNow));
      const labels={today:["今天的行程","今天要走的路，打開就看得到。"],upcoming:["接下來的行程","已規劃、還沒出發的家庭旅行。"],past:["走過的日子","已完成的旅程，和日期已過但還沒回填的規劃。"],all:["全部旅程","今天、以後與已經走過的日子，都在這裡。"]};
      const label=labels[view]||labels.today;
      const cards=filtered.length?filtered.map(t=>card(t,view)).join(""):'<div class="empty"><p><b>這個分類目前沒有行程</b></p><p class="small">點「首頁」或其他日期看看。</p></div>';
      app.innerHTML='<section class="hero"><div class="hero-copy"><div class="eyebrow">FAMILY TRAVEL JOURNAL · 桃園出發</div><h1>把一起走過的路，<br>和下一趟放在同一處。</h1><p>今天、未來和已完成的家庭行程，都用同一個網址整理。每趟旅程另有自己的短連結，方便放進家族行事曆。</p><div class="stat-row"><span class="stat">'+trips.filter(t=>t.state==="done").length+' 趟已完成</span><span class="stat">'+trips.filter(t=>t.state!=="done").length+' 筆行程待走／回填</span></div></div><figure class="hero-photo"><img src="https://raw.githubusercontent.com/NickWang0317/osaka-chill-trip/main/images/d4-kyoto.jpg" alt="京阪之旅留下的京都街景照片" onerror="this.style.display=\'none\'"><figcaption>京阪之旅的風景，也收在這本手帳裡。</figcaption></figure></section><div class="notice"><p><b>給家人的固定入口</b></p><p>分享總站就能看全部行程；放入行事曆時，請複製該趟專屬網址。頁面公開，不需要另外邀請。</p></div><section><div class="section-head"><div><h2>'+label[0]+'</h2><p>'+label[1]+'</p></div><p>今天 · '+escapeHtml(dayNow.replaceAll("-","/"))+'</p></div><div class="cards">'+cards+'</div></section>'+footer();
      document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.view===view));
    }
    function renderTrip(t){
      const statusClass=t.state==="done"?"done":t.state==="waiting"?"waiting":"planned";
      const timeline=(t.stops||[]).map(row=>{const time=Array.isArray(row)?row[0]:row.time;const title=Array.isArray(row)?row[1]:row.title;const desc=Array.isArray(row)?row[2]:row.desc;const facts=Array.isArray(row)||!row.hours?"":'<div class="stop-facts"><p>◷ '+escapeHtml(row.hours)+'</p></div>';const restroom=Array.isArray(row)||!row.restroom?"":'<p class="location-note"><b>如廁安排：</b>'+escapeHtml(row.restroom)+'</p>';const rowPhotos=Array.isArray(row)||!row.photos?"":'<div class="stop-photos">'+row.photos.map(p=>'<img src="'+escapeHtml(p[0])+'" alt="'+escapeHtml(p[1])+'" loading="lazy" onerror="this.style.display=\'none\'">').join("")+'</div>';const links=Array.isArray(row)||!row.links?"":'<div class="stop-links">'+row.links.map(l=>'<a class="button alt" href="'+escapeHtml(l.href)+'" target="_blank" rel="noopener">'+escapeHtml(l.label)+' ↗</a>').join("")+'</div>';return '<article class="timeline-stop"><div class="time">'+escapeHtml(time)+'</div><div><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(desc)+'</p>'+facts+restroom+rowPhotos+links+'</div></article>'}).join("");
      const days=(t.days||[]).map((d,i)=>'<article class="timeline-stop"><div class="time">第 '+(i+1)+' 天</div><div><h3>'+escapeHtml(d)+'</h3></div></article>').join("");
      const photos=t.photos?'<div class="photo-strip">'+t.photos.map(p=>'<img src="'+escapeHtml(p[0])+'" alt="'+escapeHtml(p[1])+'" loading="lazy" onerror="this.style.display=\'none\'"></div>').join("")+'</div>':'';
      const notes=(t.notes||[]).map(n=>'<li>'+escapeHtml(n)+'</li>').join("");
      const archive=t.archiveUrl?'<p><a class="button alt" href="'+escapeHtml(t.archiveUrl)+'" target="_blank" rel="noopener">開啟大阪原始八日詳細行程 ↗</a></p>':'';
      const extra=t.state==="planned"&&!t.details?'<div class="summary-box"><b>營業時間要點</b><p>'+escapeHtml(t.notes[0])+'</p></div>':'';
      const details=(t.details||[]).map(d=>'<section class="panel guide-card"><h2>'+escapeHtml(d.title)+'</h2><p>'+escapeHtml(d.intro)+'</p><ul>'+d.bullets.map(x=>'<li>'+escapeHtml(x)+'</li>').join("")+'</ul></section>').join("");
      const checklist=t.checklist?'<section class="panel checklist-card"><h2>出門前，勾一下</h2><ul class="checklist">'+t.checklist.map((x,i)=>'<li><label><input class="trip-check" type="checkbox" data-check="'+escapeHtml(t.id)+'-'+i+'"><span>'+escapeHtml(x)+'</span></label></li>').join("")+'</ul><p class="small">勾選只保存在此裝置，不會同步到另一支手機。</p></section>':'';
      const sources=t.sources?'<section class="panel"><h2>官方資訊</h2><ul class="source-list">'+t.sources.map(s=>'<li><a href="'+escapeHtml(s[1])+'" target="_blank" rel="noopener">'+escapeHtml(s[0])+' ↗</a></li>').join("")+'</ul><p class="small">資訊查核：'+escapeHtml(t.checkedOn||"")+'。臨時異動、候位與最後點餐以各店公告為準。</p></section>':'';
      const blog=t.blog?'<article class="blog-article"><p class="blog-intro">'+escapeHtml(t.blog.intro)+'</p>'+t.blog.sections.map(s=>'<section class="blog-section"><h2>'+escapeHtml(s.title)+'</h2><p>'+escapeHtml(s.text)+'</p>'+(s.photo?'<figure><img src="'+escapeHtml(s.photo[0])+'" alt="'+escapeHtml(s.photo[1])+'" loading="lazy"><figcaption>'+escapeHtml(s.photo[2])+'</figcaption></figure>':'')+'</section>').join('')+'<p class="blog-ending">今天沒有照原定計畫走，卻用一場車窗外的煙火，替 10/10 留下了結尾。</p></article>':'';
      const dailyBlog=(()=>{const days=t.blogDays||[];const requested=Number(params.get("day"));const active=Number.isInteger(requested)&&requested>=1&&requested<=days.length?requested-1:0;const d=days[active];if(!d)return "";const tabs=days.map((x,i)=>'<a class="daily-tab '+(i===active?'active':'')+'" href="?t='+encodeURIComponent(t.id)+'&day='+(i+1)+'"'+(i===active?' aria-current="page"':'')+'>第 '+(i+1)+' 天<br>'+escapeHtml(x.date.slice(5))+'</a>').join("");const paragraphs=d.paragraphs.map(p=>'<p>'+escapeHtml(p)+'</p>').join("");const photo=d.photo?'<figure><img src="'+escapeHtml(d.photo[0])+'" alt="'+escapeHtml(d.photo[1])+'" loading="lazy"><figcaption>'+escapeHtml(d.photo[2])+'</figcaption></figure>':'<div class="photo-missing">📷 這一天目前還沒有照片，網誌先保留文字。</div>';const dayUrl=location.origin+location.pathname+'?t='+encodeURIComponent(t.id)+'&day='+(active+1);return '<section class="daily-blogs"><nav class="daily-nav" aria-label="京阪每日網誌">'+tabs+'</nav><article class="daily-entry"><span class="date-chip">'+escapeHtml(d.date)+'</span><h2>'+escapeHtml(d.title)+'</h2>'+paragraphs+photo+'<div class="day-share"><div><b>分享這一天</b><br><code>'+escapeHtml(dayUrl)+'</code></div><button class="button" type="button" data-copy-url="'+escapeHtml(dayUrl)+'">複製本日網址</button></div><p class="daily-source-note">依已保存的京阪行程紀錄整理；沒有記下的臨時變動不自行補寫。</p></article></section>'})();
      const tripContent=t.blogDays?dailyBlog:t.blog?blog:'<section><div class="section-head"><div><h2>旅程內容</h2><p>行程隨當天狀況彈性調整。</p></div></div><div class="timeline">'+(timeline||days)+'</div></section>'+(details?'<div class="guide-grid">'+details+'</div>':'')+checklist+sources+(notes&&!t.sources?'<section class="panel"><h2>出發前記得</h2><ul>'+notes+'</ul></section>':'')+archive;
      app.innerHTML='<a class="back-link" href="?v=today">← 回到家庭行程總站</a><section class="detail-hero"><div class="detail-meta"><span class="date-chip">'+escapeHtml(dateText(t.start,t.end))+'</span><span class="status '+statusClass+'">'+escapeHtml(t.label)+'</span></div><h1>'+escapeHtml(t.title)+'</h1><p><b>'+escapeHtml(t.area)+'</b></p><p>'+escapeHtml(t.summary)+'</p></section>'+photos+'<div class="calendar-box"><div><b>這趟的行事曆網址</b><br><code>'+escapeHtml(tripUrl(t.id))+'</code></div><button class="button" type="button" data-copy="'+escapeHtml(t.id)+'">複製網址</button><span class="toast" data-toast="'+escapeHtml(t.id)+'" aria-live="polite"></span></div>'+extra+tripContent+footer();
      document.querySelectorAll(".trip-check").forEach(input=>{const key="family-travel-hub:"+input.dataset.check;try{input.checked=localStorage.getItem(key)==="1";input.addEventListener("change",()=>localStorage.setItem(key,input.checked?"1":"0"))}catch{}});
      document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active"));
      document.title=t.title+"｜家庭旅行手帳";
    }
    document.addEventListener("click",async e=>{const b=e.target.closest("[data-copy], [data-copy-url]");if(!b)return;const id=b.dataset.copy;const toast=id?document.querySelector('[data-toast="'+id+'"]'):null;const value=b.dataset.copyUrl||tripUrl(id);try{await navigator.clipboard.writeText(value);if(toast)toast.textContent="已複製，可以貼到家族行事曆。";else b.textContent="已複製本日網址"}catch{if(toast)toast.textContent="複製未成功，請長按上方網址複製。";else b.textContent="複製失敗，請長按網址複製"}});
    const trip=trips.find(t=>t.id===params.get("t"));
    if(trip)renderTrip(trip);else renderHome(["today","upcoming","past","all"].includes(params.get("v"))?params.get("v"):"all");
  </script>
</body>
</html>
